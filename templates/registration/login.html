
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login | ClassRoom</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #08111f;
            color: #f8fafc;
        }

        .login-card {
            width: min(400px, 90%);
            background: #111f32;
            border: 1px solid #26364a;
            border-radius: 18px;
            padding: 32px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #94a3b8;
        }

        label {
            display: block;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #40516a;
            border-radius: 8px;
            background: #0b1627;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #00b7b5;
            color: #04131c;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #fca5a5;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>ClassRoom</h1>
        <p>Sign in to your workspace</p>

        {% if form.errors %}
            <p class="error">
                Invalid username or password.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            {{ form.username }}

            <label for="id_password">Password</label>
            {{ form.password }}

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
